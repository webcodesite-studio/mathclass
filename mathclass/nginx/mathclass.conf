# ── Rate limiting zones ─────────────────────────────────────────
# Definiuj poza blokiem server (np. w http {} w nginx.conf głównym)
# Jeśli używasz jednego pliku sites-available, przenieś to do /etc/nginx/nginx.conf sekcji http
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;

server {
    listen 80;
    server_name twoja-domena.pl;   # ← zmień na swoją domenę

    # Przekieruj HTTP → HTTPS (odkomentuj po skonfigurowaniu SSL)
    # return 301 https://$host$request_uri;

    # ── Security headers ────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"              always;
    add_header X-Content-Type-Options   "nosniff"                 always;
    add_header X-XSS-Protection         "1; mode=block"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';"
        always;

    # ── Rozmiar uploadu ─────────────────────────────────────────
    client_max_body_size 10M;

    # ── Frontend (React build) ──────────────────────────────────
    root /var/www/mathclass/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API — ogólny limit ──────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Nie zwracaj wersji backendu
        proxy_hide_header  X-Powered-By;
    }

    # ── Login — surowy limit brute force ────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload plików ───────────────────────────────────────────
    location /uploads/ {
        alias   /var/www/mathclass/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Zablokuj wykonywanie PHP/skryptów z katalogu uploads
        location ~* \.(php|sh|py|pl|cgi)$ {
            deny all;
        }
    }

    # ── Ukryj wrażliwe pliki ────────────────────────────────────
    location ~ /\. {
        deny all;
    }
    location ~ \.(env|sql|log|md)$ {
        deny all;
    }
}

